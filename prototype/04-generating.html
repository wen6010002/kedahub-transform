<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在为你制定专属路线 · 课搭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<style>
body { background: var(--indigo-night); color: #EFE7D8; overflow-x: hidden; }
body::before { opacity: .5; }

.gen { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; position: relative; }
.gen-inner { width: min(760px, 100%); }

/* 背景大字 */
.gen-bg {
  position: fixed; right: -40px; bottom: -60px; font-family: var(--f-display); font-weight: 900;
  font-size: clamp(300px, 40vw, 560px); color: rgba(247,242,233,.03); line-height: 1; pointer-events: none; user-select: none;
}

.gen-head { margin-bottom: 46px; }
.gen-kicker { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .3em; color: var(--vermilion-bright); margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
.gen-kicker .blink { width: 8px; height: 8px; border-radius: 50%; background: var(--vermilion-bright); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .2; } }
.gen-head h1 { font-family: var(--f-display); font-weight: 900; font-size: clamp(1.7rem, 4vw, 2.6rem); line-height: 1.5; }

/* 工序日志 */
.steps-log { display: flex; flex-direction: column; gap: 15px; min-height: 260px; margin-bottom: 8px; }
.log-item {
  display: flex; gap: 16px; align-items: baseline; opacity: 0; transform: translateY(8px);
  animation: login .55s cubic-bezier(.2,.7,.2,1) forwards;
  font-size: .95rem; color: #B8AD99;
}
.log-item .tick { font-family: var(--f-mono); color: rgba(184,173,153,.3); flex: none; width: 20px; transition: color .3s; }
.log-item.done .tick { color: var(--spruce); position: relative; }
.log-item.done .tick::after { content: '✓'; }
.log-item.done .tick span { display: none; }
.log-item.doing { color: #EFE7D8; }
.log-item.doing .tick span { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--vermilion-bright); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes login { to { opacity: 1; transform: none; } }
.log-item em { font-style: normal; color: var(--vermilion-bright); font-weight: 600; }

/* 路线装配预览（完成后浮现） */
.assemble { opacity: 0; transform: translateY(20px); transition: all .8s cubic-bezier(.2,.7,.2,1); margin: 34px 0 10px; }
.assemble.in { opacity: 1; transform: none; }
.asm-track { position: relative; height: 86px; }
.asm-line { position: absolute; top: 14px; left: 2%; right: 2%; height: 2px; background: rgba(247,242,233,.15); }
.asm-line .fill { position: absolute; inset: 0; background: var(--vermilion-bright); transform-origin: left; transform: scaleX(0); transition: transform 1.8s cubic-bezier(.6,0,.2,1); }
.assemble.in .asm-line .fill { transform: scaleX(1); }
.asm-nodes { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0 2%; }
.asm-node { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 11%; opacity: 0; animation: nodein .5s cubic-bezier(.2,.7,.2,1) forwards; }
.asm-node .d { width: 12px; height: 12px; border-radius: 50%; background: var(--indigo-night); border: 2.5px solid var(--vermilion-bright); margin-top: 8px; }
.asm-node:first-child .d { background: var(--vermilion-bright); }
.asm-node:last-child .d { border-radius: 4px; transform: rotate(45deg); border-width: 2.5px; margin-top: 7px; width: 14px; height: 14px; }
.asm-node .t { font-size: .68rem; color: #CFC5B4; text-align: center; line-height: 1.5; }
.asm-node .w { font-family: var(--f-mono); font-size: .56rem; color: #877D6B; }
@keyframes nodein { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* 完成 + 落章 */
.done-wrap { text-align: center; padding-top: 40px; }
.done-title { font-family: var(--f-display); font-weight: 900; font-size: 1.9rem; opacity: 0; animation: login .6s .2s forwards; }
.done-sub { color: #B8AD99; font-size: .9rem; margin-top: 10px; opacity: 0; animation: login .6s .45s forwards; }
.stamp-zone { height: 130px; display: grid; place-items: center; margin: 10px 0 6px; }
.stamp {
  width: 108px; height: 108px; display: grid; place-items: center;
  background: var(--seal-red); color: #F9EFE3; border-radius: 12px;
  font-family: var(--f-display); font-weight: 900; font-size: 1.35rem; line-height: 1.4;
  box-shadow: inset 0 0 0 3px rgba(249,239,227,.4), inset 0 0 0 6px var(--seal-red), 0 18px 40px -14px rgba(178,58,32,.65);
  transform: rotate(-8deg) scale(3); opacity: 0;
}
.stamp.landed { animation: slam .55s cubic-bezier(.3,1.6,.4,1) forwards; }
@keyframes slam {
  0% { transform: rotate(-8deg) scale(3); opacity: 0; }
  60% { transform: rotate(-8deg) scale(.94); opacity: 1; }
  100% { transform: rotate(-8deg) scale(1); opacity: 1; }
}
.paper-shake { animation: shake .3s .38s ease; }
@keyframes shake { 0%,100% { transform: none; } 30% { transform: translate(2px,1px); } 60% { transform: translate(-1px,-1px); } }
.enter-btn { opacity: 0; animation: login .6s .8s forwards; display: inline-flex; margin-top: 18px; background: #EFE7D8; color: var(--indigo-night); border-radius: 999px; padding: 15px 34px; font-weight: 700; font-size: 1rem; transition: transform .2s, box-shadow .2s; box-shadow: 0 12px 34px -12px rgba(239,231,216,.45); }
.enter-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 44px -12px rgba(239,231,216,.6); }

.skip { position: fixed; right: 26px; bottom: 22px; font-family: var(--f-mono); font-size: .66rem; color: #877D6B; letter-spacing: .16em; opacity: 0; animation: login 1s 2.4s forwards; cursor: pointer; }
.skip:hover { color: #B8AD99; }
</style>
</head>
<body>
<div class="gen paper-shake" id="gen">
  <div class="gen-bg">路</div>
  <div class="gen-inner">
    <div class="gen-head">
      <div class="gen-kicker"><span class="blink"></span>ROUTING FOR YOU</div>
      <h1>正在根据你的情况，<br>制定专属路线……</h1>
    </div>

    <div class="steps-log" id="log"></div>

    <div class="assemble" id="assemble">
      <div class="asm-track">
        <div class="asm-line"><span class="fill"></span></div>
        <div class="asm-nodes">
          <span class="asm-node" style="animation-delay:.2s"><span class="d"></span><span class="t">Python 补差</span><span class="w">1 周</span></span>
          <span class="asm-node" style="animation-delay:.42s"><span class="d"></span><span class="t">FastAPI 速通</span><span class="w">2 周</span></span>
          <span class="asm-node" style="animation-delay:.64s"><span class="d"></span><span class="t">LLM 基础</span><span class="w">2 周</span></span>
          <span class="asm-node" style="animation-delay:.86s"><span class="d"></span><span class="t">RAG</span><span class="w">3 周</span></span>
          <span class="asm-node" style="animation-delay:1.08s"><span class="d"></span><span class="t">Agent 开发</span><span class="w">3 周</span></span>
          <span class="asm-node" style="animation-delay:1.3s"><span class="d"></span><span class="t">生产化</span><span class="w">2 周</span></span>
          <span class="asm-node" style="animation-delay:1.52s"><span class="d"></span><span class="t">项目包装</span><span class="w">1 周</span></span>
          <span class="asm-node" style="animation-delay:1.74s"><span class="d"></span><span class="t">求职冲刺</span><span class="w">2 周</span></span>
        </div>
      </div>
    </div>

    <div class="done-wrap" id="doneWrap" hidden>
      <div class="done-title">你的专属路线，已就绪。</div>
      <div class="done-sub">16 周 · 8 个阶段 · 相比标准模板为你做了 3 处调整</div>
      <div class="stamp-zone"><div class="stamp" id="stamp">路线<br>已定</div></div>
      <a class="enter-btn" href="05-roadmap.html">展开我的路线 <span style="font-family:var(--f-latin)">→</span></a>
    </div>
  </div>
</div>
<span class="skip" onclick="fastForward()">跳过 →</span>

<script src="assets/app.js"></script>
<script>
(function () {
  // 工序文案（把后台的取舍翻译成人话）
  var lines = [
    '核对方向模板：<em>K-02 Java 后端 → AI Agent 开发</em>（第 3 版 · 已验证）',
    '读取你的情况：大二 / Java 课设级项目 / Python 零基础 / 每天 2 小时',
    '你的 Java 已有课设项目——<em>FastAPI 阶段压缩 1 周</em>，专注 AI 侧',
    'Python 零基础——保留 <em>Java 人专属迁移路径</em>，1 周走完',
    '按每天 2 小时排布节点密度：每周 5 个学习日 + 1 个缓冲日',
    '根据「简历好看 + 做出真东西」的偏好，选定首个实践项目：<em>深大校园问答机器人</em>',
    '路线校验通过：无断链、验收标准完整、与实习投递窗口匹配'
  ];
  var log = document.getElementById('log');
  var i = 0, timers = [];
  var finished = false;

  function addLine() {
    if (i >= lines.length) { finish(); return; }
    // 标记前一条完成
    var prev = log.querySelector('.log-item:last-child');
    if (prev) { prev.classList.remove('doing'); prev.classList.add('done'); }
    var el = document.createElement('div');
    el.className = 'log-item doing';
    el.innerHTML = '<span class="tick"><span></span></span><span>' + lines[i] + '</span>';
    log.appendChild(el);
    i++;
    timers.push(setTimeout(addLine, 700 + Math.random() * 500));
  }
  timers.push(setTimeout(addLine, 600));

  function finish() {
    if (finished) return; finished = true;
    var prev = log.querySelector('.log-item:last-child');
    if (prev) { prev.classList.remove('doing'); prev.classList.add('done'); }
    document.getElementById('assemble').classList.add('in');
    timers.push(setTimeout(function () {
      document.getElementById('doneWrap').hidden = false;
      document.getElementById('gen').classList.add('paper-shake');
      timers.push(setTimeout(function () { document.getElementById('stamp').classList.add('landed'); }, 120));
    }, 2100));
  }

  window.fastForward = function () {
    timers.forEach(clearTimeout); timers = [];
    i = lines.length;
    log.innerHTML = lines.map(function (l) { return '<div class="log-item done" style="animation:none;opacity:1;transform:none"><span class="tick"><span></span></span><span>' + l + '</span></div>'; }).join('');
    document.getElementById('assemble').style.transition = 'none';
    finish();
  };
})();
</script>
</body>
</html>
